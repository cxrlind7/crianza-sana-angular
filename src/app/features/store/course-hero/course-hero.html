<header class="hero-section text-center text-lg-start py-4 py-lg-5">
  <div class="row align-items-center gx-lg-5">
    <div class="col-lg-7 order-2 order-lg-1 mt-3 mt-lg-0">
      <span class="badge bg-cyan text-white mb-3 px-3 py-2 rounded-pill fw-bold">
        NUEVO PROGRAMA
      </span>
      <h1 class="hero-title fw-bolder mb-3 text-dark">{{ course.title }}</h1>
      <p class="hero-subtitle lead mb-4 text-secondary">{{ course.subtitle }}</p>

      <div class="presenter-info d-flex align-items-center mt-4 p-3 rounded-3 presenter-card d-none d-lg-inline-flex">
        <div class="image-glow-ring-small me-3">
          <img [src]="course.presenter.image" [alt]="course.presenter.name" class="presenter-photo-small" />
        </div>
        <div>
          <h5 class="m-0 fw-bold text-cyan">{{ course.presenter.name }}</h5>
          <small class="text-muted">{{ course.presenter.role }}</small>
        </div>
      </div>
    </div>

    <div class="col-lg-5 order-1 order-lg-2 mb-4 mb-lg-0 text-center">
      <div class="d-lg-none">
        <div class="image-glow-ring mx-auto mb-3">
          <img [src]="course.presenter.image" [alt]="course.presenter.name" class="presenter-photo-large" />
        </div>
        <h4 class="text-cyan fw-bold mb-1">{{ course.presenter.name }}</h4>
        <p class="text-muted mb-0">{{ course.presenter.role }}</p>
      </div>

      <div class="d-none d-lg-block">
        <div class="video-intro-placeholder position-relative rounded-4 overflow-hidden shadow-lg mx-auto ms-lg-auto">
          <img [src]="course.presenter.image" alt="Miniatura Video Introducción" class="img-fluid w-100 video-thumbnail" />

          <div class="play-overlay position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center">
            <div class="play-button-bg bg-white rounded-circle d-flex justify-content-center align-items-center mb-2">
              <i class="bi bi-play-fill text-cyan play-icon"></i>
            </div>
            <span class="text-white fw-bold text-shadow">Ver Introducción</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
