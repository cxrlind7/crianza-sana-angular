@if (showToast()) {
  <div class="toast-notification">
    <i class="fas fa-check-circle toast-icon"></i>
    <span>¡Enlace copiado al portapapeles!</span>
  </div>
}

<div class="person-short-videos-section" [class.d-none]="!videos || videos.length === 0">
  <div class="container-fluid main-container">
    <div class="text-center mb-5 fade-in">
      <h6 class="text-uppercase letter-spacing-2 text-muted mb-2">Contenido Exclusivo</h6>
      <h2 class="display-6 fw-bold text-dark">Videos Cortos</h2>
    </div>

    <div class="carousel-container position-relative fade-in delay-1" [style.--arrow-color]="personColor">
      <swiper-container #swiperContainer init="false" class="short-videos-swiper" [style.--swiper-pagination-color]="personColor">
        @for (video of videos; track video.url) {
          <swiper-slide class="h-auto">
            <div class="short-video-card h-100">
              <video class="short-video-player" [poster]="video.poster || ''" controls preload="metadata" playsinline>
                <source [src]="video.url" type="video/mp4" />
              </video>
              <button type="button" class="share-btn" (click)="shareVideo(video)" title="Compartir video">
                <i class="fas fa-share-nodes"></i>
              </button>
            </div>
          </swiper-slide>
        }
      </swiper-container>

      <div class="custom-arrow sv-custom-prev">
        <i class="fas fa-chevron-left"></i>
      </div>
      <div class="custom-arrow sv-custom-next">
        <i class="fas fa-chevron-right"></i>
      </div>
    </div>
  </div>
</div>

@if (selectedVideo(); as selectedVideo) {
  <div class="short-video-modal-overlay" (click)="$event.target === $event.currentTarget && closeVideo()">
    <div class="short-video-modal-container">
      <button class="close-modal-btn-on-dark" (click)="closeVideo()" title="Cerrar">✖</button>
      <video
        class="short-video-modal-player"
        [poster]="selectedVideo.poster || ''"
        controls
        autoplay
        playsinline
      >
        <source [src]="selectedVideo.url" type="video/mp4" />
      </video>
    </div>
  </div>
}
